# Spreelytics tracking proxy on Kubernetes.
# Apply with: kubectl apply -f k8s.yaml
# Then point a hostname on your domain (for example t.example.com) at it with the Ingress below,
# or with whatever ingress or gateway you already run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spreelytics-proxy
  labels:
    app: spreelytics-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spreelytics-proxy
  template:
    metadata:
      labels:
        app: spreelytics-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          # `1` follows every 1.x release and is rebuilt weekly with nginx and Alpine security fixes.
          # Always pull, so a restart (kubectl rollout restart deployment/spreelytics-proxy) gets the newest build.
          image: ghcr.io/spreelytics/tracking-proxy:1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # With a read-only root filesystem, nginx still needs to write its config
          # (rendered from the template at startup) and its temp files.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spreelytics-proxy
spec:
  selector:
    app: spreelytics-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Optional: expose it on your own hostname. Change the class, host and TLS to match your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spreelytics-proxy
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [t.example.com]
      secretName: spreelytics-proxy-tls
  rules:
    - host: t.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spreelytics-proxy
                port:
                  name: http
